name: daily forecast

on:
  schedule:
    - cron: "15 9 * * *"   # ~4:15 a.m. Philadelphia (5:15 during daylight time)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: emilyou561-beep/indego-station-status-archive
          path: archive
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      - run: python -m forecast.daily --archive archive

      - name: Commit
        run: |
          git config user.name "Emily Ou"
          git config user.email "emilyou561@gmail.com"
          git add forecasts results figures README.md
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "Forecast for $(TZ=America/New_York date +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
